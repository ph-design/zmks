description: Combos container

compatible: "zmk,combos"

child-binding:
  description: "A combo"

  properties:
    bindings:
      type: phandle-array
      required: true
    key-positions:
      type: array
      required: true
    timeout-ms:
      type: int
      default: 50
    require-prior-idle-ms:
      type: int
      default: -1
    slow-release:
      type: boolean
    layers:
      type: array
    reserved:
      type: boolean
      description: |
        Marks this combo slot as reserved for runtime use (e.g. ZMK Studio).
        Reserved slots keep their position in the combos array so that
        ZMK_VIRTUAL_KEY_POSITION_COMBO(index) and downstream virtual key
        positions stay fixed, but are disabled at boot: their key positions
        only serve to size MAX_COMBO_KEYS and are not entered into the combo
        lookup table. A runtime config write (assigning real key positions)
        enables the slot.
